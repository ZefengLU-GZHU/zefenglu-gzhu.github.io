<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Primary navigation">
        <button aria-label="Menu"><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item">
            <a href="#about-me"><span class="lang-zh">卢泽丰</span><span class="lang-en">Zefeng Lu</span></a>
          </li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item">
              <a href="{{ domain }}{{ link.url }}"><span class="lang-zh">{{ link.title_zh }}</span><span class="lang-en">{{ link.title_en }}</span></a>
            </li>
          {% endfor %}
          <li class="masthead__menu-item language-menu-item">
            <button class="language-toggle" type="button" aria-label="Switch to English">EN</button>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
